    q2804[A]:
    - Exija simultaneamente norma ou processo formal e caso concreto; a ausencia de qualquer um desses elementos impede classificacao
      como conforme.
    - A norma/processo deve cobrir contratacoes de solucoes de TI independentemente da area demandante, ou demonstrar abrangencia
