  titulo: q2804_A - a) as contratações de soluções de TI, independentemente de qual seja a área demandante, são obrigatoriamente
    submetidas à análise prévia e aprovação técnica da área de gestão de TI
  escopo:
  - Avalie somente a evidencia enviada para `q2804eviA` e compare-a com os itens afirmados pelo auditado.
  - Considere a resposta declarada apenas como afirmacao a ser verificada; a conclusao deve vir da evidencia analisada.
  evidencias_suficientes:
  - Demonstra simultaneamente a existencia de norma ou processo formal vigente que obrigue a analise previa e aprovacao tecnica
    da area de gestao de TI para contratacoes de solucoes de TI.
  - Apresenta ao menos um caso concreto de contratacao em que a area de gestao de TI tenha realizado analise previa e/ou aprovacao
    tecnica antes da contratacao ou etapa decisoria relevante.
  - Permite vincular a norma/processo e o caso concreto a organizacao auditada, com data, vigencia ou periodo aplicavel.
  evidencias_insuficientes:
  - Apenas norma generica de contratacoes, sem obrigatoriedade clara de analise previa ou aprovacao tecnica pela TI.
  - Apenas caso concreto, processo SEI, ETP, DFD, edital ou contrato sem norma/processo formal que estabeleca a obrigatoriedade.
  - Apenas norma/processo formal sem qualquer caso concreto que demonstre aplicacao.
  lacunas_inconclusivas:
  - Ha norma ou fluxo pertinente, mas nao e possivel verificar vigencia, autoridade, abrangencia ou obrigatoriedade para todas
    as areas demandantes.
  - Ha caso concreto pertinente, mas falta trecho que demonstre analise previa ou aprovacao tecnica pela area de gestao de
    TI.
  - Ha indicios dos dois elementos exigidos, mas um deles esta ilegivel, incompleto ou sem vinculo claro com a organizacao
    auditada.
